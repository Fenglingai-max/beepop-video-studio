name: Publish bundled Windows download
on:
  push:
    paths: ['.github/workflows/publish-windows-voice.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify every file against the tested package
        shell: python
        run: |
          import base64, hashlib, io, json, pathlib, re, urllib.request, zipfile
          from pathlib import Path
          m=json.loads(Path('companion-oneclick.json').read_text())['platforms']['windows']
          b=b''.join(Path(p).read_bytes() for p in m['parts'])
          assert hashlib.sha256(b).hexdigest()==m['sha256']
          prefix='BeePOP/internal/'
          root=Path('bundled')
          root.mkdir()
          ws="overrides:\n  '@openai/codex>@openai/codex-win32-x64': file:vendor/codex-win-x64.tgz\n  '@huggingface/transformers>onnxruntime-node': file:vendor/onnxruntime-node.tgz\n"
          with zipfile.ZipFile(io.BytesIO(b)) as src, zipfile.ZipFile('BeePOP-Windows-Bundled.zip','w') as dest:
              s=src.read(prefix+'pnpm-lock.yaml').decode().replace('importers:',ws+'\nimporters:',1)
              for package,version,name in [('@openai/codex','0.163.0-alpha.11-win32-x64','codex-win-x64.tgz'),('onnxruntime-node','1.21.0','onnxruntime-node.tgz')]:
                  short=package.split('/')[-1]
                  url=f'https://registry.npmjs.org/{package}/-/{short}-{version}.tgz'
                  data=urllib.request.urlopen(url,timeout=180).read()
                  tar='file:vendor/'+name
                  old=package+'@'+version
                  new=package+'@'+tar
                  s=s.replace(old,new)
                  pattern=re.escape(new)+r"'?:\n    resolution: \{integrity: (sha512-[^}]+)\}"
                  match=re.search(pattern,s)
                  assert match and match[1]=='sha512-'+base64.b64encode(hashlib.sha512(data).digest()).decode()
                  s=s[:match.end()-1]+', tarball: '+tar+'}\n    version: '+version+s[match.end():]
                  if package=='onnxruntime-node': s=s.replace('      onnxruntime-node: '+version,'      onnxruntime-node: '+tar)
                  dest.writestr(prefix+'vendor/'+name,data)
              dest.writestr(prefix+'pnpm-workspace.yaml',ws)
              for item in src.infolist():
                  dest.writestr(item,s.encode() if item.filename==prefix+'pnpm-lock.yaml' else src.read(item))
          with zipfile.ZipFile('BeePOP-Windows-Bundled.zip') as z:
              hashes={i.filename:hashlib.sha256(z.read(i)).hexdigest() for i in z.infolist()}
          assert hashlib.sha256(json.dumps(hashes,sort_keys=True).encode()).hexdigest()=='a24321ddd48736410d0d1a7b37c8c1d1549fc458b83b1298ab3cfbba1272477a'
          with zipfile.ZipFile('BeePOP-Windows-Bundled.zip','a') as z:
              voice=json.loads(z.read(prefix+'voice-model.json'))
              for item in voice['files']:
                  url='https://huggingface.co/'+voice['repository']+'/resolve/'+voice['revision']+'/'+item['path']
                  with urllib.request.urlopen(url,timeout=300) as response:
                      data=response.read()
                  assert len(data)==item['bytes'] and hashlib.sha256(data).hexdigest()==item['sha256']
                  z.writestr(prefix+'data/models/kokoro-v1/'+item['path'],data,compress_type=zipfile.ZIP_DEFLATED)
              assert z.testzip() is None
          Path('BeePOP-Windows-Bundled.zip').rename('BeePOP-Windows-Voice.zip')
      - name: Verify shipped voice preparation without a network fetch on Windows
        shell: bash
        run: |
          python -m zipfile -e BeePOP-Windows-Voice.zip test-package
          cd test-package/BeePOP/internal
          node -e "global.fetch=()=>{throw Error('Unexpected network request')};require('./setup-voice.cjs').ensureVoice().catch(e=>{console.error(e);process.exitCode=1})"
      - name: Publish verified ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload windows-bundled-20261127 BeePOP-Windows-Voice.zip

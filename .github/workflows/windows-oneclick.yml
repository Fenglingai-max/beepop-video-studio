name: Windows one-click startup validation
on:
  push:
    paths:
      - 'oneclick-source.zip'
      - 'oneclick-windows-smoke.ps1'
      - 'companion-oneclick.json'
      - '.github/workflows/windows-oneclick.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify Windows download
        shell: python
        run: |
          import json, pathlib, hashlib
          m=json.loads(pathlib.Path('companion-oneclick.json').read_text())['platforms']['windows']
          b=b''.join(pathlib.Path(p).read_bytes() for p in m['parts'])
          assert len(b)==m['bytes'] and hashlib.sha256(b).hexdigest()==m['sha256']
          pathlib.Path('BeePOP-Windows.zip').write_bytes(b)
      - name: Test real cmd entry on Windows PowerShell 5.1
        shell: powershell
        run: Invoke-Expression (Get-Content -LiteralPath .\oneclick-windows-smoke.ps1 -Raw -Encoding UTF8)
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-oneclick-startup-logs
          path: |
            ${{ runner.temp }}/BeePOP*/**/*.log
            ~/AppData/Local/BeePOP/logs/*.log

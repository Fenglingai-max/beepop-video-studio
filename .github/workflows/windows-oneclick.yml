name: Windows one-click startup validation
on:
  push:
    paths:
      - 'oneclick-source.zip'
      - 'oneclick-windows-smoke.ps1'
      - 'companion-oneclick.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify Windows download
        shell: python
        run: |
          import json, pathlib, hashlib
          m=json.loads(pathlib.Path('companion-oneclick.json').read_text())['platforms']['windows']
          b=b''.join(pathlib.Path(p).read_bytes() for p in m['parts'])
          assert len(b)==m['bytes'] and hashlib.sha256(b).hexdigest()==m['sha256']
          pathlib.Path('BeePOP-Windows.zip').write_bytes(b)
      - name: Test real cmd entry on Windows PowerShell 5.1
        shell: powershell
        run: Invoke-Expression (Get-Content -LiteralPath .\oneclick-windows-smoke.ps1 -Raw -Encoding UTF8)
      - name: Verify first installation through service readiness
        shell: powershell
        timeout-minutes: 35
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'BeePOP full install'
          Expand-Archive -LiteralPath BeePOP-Windows.zip -DestinationPath $dest
          $entry = Get-ChildItem -LiteralPath $dest -Recurse -Filter '*.cmd' | Where-Object { $_.Directory.Parent.FullName -eq $dest } | Select-Object -First 1
          if (!$entry) { throw 'Missing Windows launcher' }
          $env:BEEPOP_NO_OPEN = '1'
          $info = New-Object Diagnostics.ProcessStartInfo
          $info.FileName = $env:ComSpec
          $info.Arguments = '/d /c call "' + $entry.FullName + '" <nul'
          $info.UseShellExecute = $false
          $process = [Diagnostics.Process]::Start($info)
          $deadline = (Get-Date).AddMinutes(32)
          $log = Join-Path $env:LOCALAPPDATA 'BeePOP/logs/startup-windows.log'
          try {
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) { throw "Startup exited with code $($process.ExitCode)" }
              try { $health = Invoke-RestMethod 'http://127.0.0.1:47831/health' -TimeoutSec 3 } catch { $health = $null }
              if ($health.service -eq 'beepoptvc-local' -and $health.ready -eq $true) { return }
              Start-Sleep -Seconds 5
            }
            throw 'The local service did not become ready'
          } finally {
            if (Test-Path $log) { Copy-Item $log (Join-Path $dest 'full-install.log') }
            if (!$process.HasExited) { taskkill /PID $process.Id /T /F | Out-Null }
          }
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-oneclick-startup-logs
          path: ${{ runner.temp }}/BeePOP*/**/*.log
